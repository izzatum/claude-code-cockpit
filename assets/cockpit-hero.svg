<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 400" role="img" aria-labelledby="t d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><title id="t">cockpit: mission control for your Claude Code session</title><desc id="d">Dash, a gauge-faced pilot bot in an aviator cap and headset, sits in a cockpit seat under a glass canopy, one mitten on the control stick and the other giving a thumbs-up, beside the cockpit wordmark. Three instruments show context at 31% of the window, cost of $0.84 against a $5.00 alert, and the cloud-sync guard on, which blocks rm -rf in synced folders. A terminal strip shows the status line: web-app · ctx 31% · $0.84 · caveman.</desc><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono,.mono text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.card{fill:#F5F8FC;stroke:#CBD5E3}.sf{fill:#FFFFFF}.ink{fill:#142033}.mut{fill:#5A6B85}.lf{fill:#CBD5E3}.brand{fill:#2F6FEB}.ok{fill:#0F9D7A}.warn{fill:#C27A00}.bad{fill:#D93A3A}.bot{fill:#E9EEF6}.face{fill:#FFFFFF}.o{stroke:#142033}.sl{stroke:#CBD5E3}.sm{stroke:#5A6B85}.sb{stroke:#2F6FEB}.sok{stroke:#0F9D7A}.swarn{stroke:#C27A00}.sbad{stroke:#D93A3A}.sbot{stroke:#E9EEF6}.scard{stroke:#F5F8FC}.ssf{stroke:#FFFFFF}.tok{fill:#0F9D7A;fill-opacity:.14}.twarn{fill:#C27A00;fill-opacity:.16}.tbad{fill:#D93A3A;fill-opacity:.13}.glass{fill:#2F6FEB;fill-opacity:.08}.shd{fill:#142033;opacity:.12}.term{fill:#0F1726}.tedge{stroke:#142033}.tbar{fill:#1A2438}.tdv{stroke:#2A3850}.tt{fill:#D7E0EE}.td{fill:#7E8CA3}.tg{fill:#34D399}.ty{fill:#FBBF24}.tr{fill:#F87171}.tsy{stroke:#FBBF24}.thl{fill:#6EA8FE;fill-opacity:.24}@media (prefers-color-scheme:dark){.card{fill:#0F1622;stroke:#2A3850}.sf{fill:#172133}.ink{fill:#E6EDF7}.mut{fill:#8FA1BC}.lf{fill:#2A3850}.brand{fill:#6EA8FE}.ok{fill:#34D399}.warn{fill:#FBBF24}.bad{fill:#F87171}.bot{fill:#2B3A55}.face{fill:#1C2940}.o{stroke:#E6EDF7}.sl{stroke:#2A3850}.sm{stroke:#8FA1BC}.sb{stroke:#6EA8FE}.
<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 452" role="img" aria-labelledby="t d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><title id="t">cockpit MCP server health board for Claude Code</title><desc id="d">MCP health board with servers marked ok, need sign-in or failed, and a pop-up for the one server that failed to connect. Dash, the gauge-faced pilot bot, looks out of an airport control tower through binoculars and spots the failed server. The board lists docs ok, mail need sign-in, my-server failed, tickets ok, wiki need sign-in, and 10 more ok. The summary reads 12 ok, 2 need sign-in, 1 failed. A toast says: cockpit: 1 MCP server(s) failed to connect: my-server. It pops up once, only if a server failed. Checked in the background with claude mcp list.</desc><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono,.mono text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.card{fill:#F5F8FC;stroke:#CBD5E3}.sf{fill:#FFFFFF}.ink{fill:#142033}.mut{fill:#5A6B85}.lf{fill:#CBD5E3}.brand{fill:#2F6FEB}.ok{fill:#0F9D7A}.warn{fill:#C27A00}.bad{fill:#D93A3A}.bot{fill:#E9EEF6}.face{fill:#FFFFFF}.o{stroke:#142033}.sl{stroke:#CBD5E3}.sm{stroke:#5A6B85}.sb{stroke:#2F6FEB}.sok{stroke:#0F9D7A}.swarn{stroke:#C27A00}.sbad{stroke:#D93A3A}.sbot{stroke:#E9EEF6}.scard{stroke:#F5F8FC}.ssf{stroke:#FFFFFF}.tok{fill:#0F9D7A;fill-opacity:.14}.twarn{fill:#C27A00;fill-opacity:.16}.tbad{fill:#D93A3A;fill-opacity:.13}.glass{fill:#2F6FEB;fill-opacity:.08}.shd{fill:#142033;opacity:.12}.term{fill:#0F1726}.tedge{stroke:#142033}.tbar{fill:#1A2438}.tdv{stroke:#2A3850}.tt{fill:#D7E0EE}.td{fill:#7E8CA3}.tg{fill:#34D399}.ty{fill:#FBBF24}.tr{fill:#F87171}.tsy{stroke:#FBBF24}.thl{fill:#6EA8FE;fill-opacity:.24}@media (prefers-color-scheme:dark){.card{fill:#0F1622;stroke:#2A3850}.sf{fill:#172133}.ink{fill:#E6EDF7}.mut{fill:#8FA1BC}.lf{fill:#2A3850}.brand{fill:#6EA8FE}.ok{fill:#34D399}.warn{fill:#FBBF24}.bad{fill:#F87171}.bot{fill:#2B3A55}.face{fill:#1C2940}.o{stroke:#E6EDF7}.sl{stroke:#2A3850}.sm{stroke:#8FA1BC}.sb{stroke:#6EA8FE}.sok{stroke:#34D399}.swarn{stroke:#FBBF24}.sbad{stroke:#F87171}.sbot{stroke:#2B3A55}.scard{stroke:#0F1622}.ssf{stroke:#172133}.tok{fill:#34D399;fill-opacity:.16}.twarn{fill:#FBBF24;fill-opacity:.16}.tbad{fill:#F87171;fill-opacity:.16}.glass{fill:#6EA8FE;fill-opacity:.08}.shd{fill:#000000;opacity:.4}.tedge{stroke:#8FA1BC}}.led,.wob,.pulse,.spin,.cur{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.led{animation:led 2.4s ease-in-out infinite}.wob{animation:wob 3s ease-in-out infinite}.pulse{animation:pulse 2s ease-in-out infinite}.spin{animation:spin 4s linear infinite}.cur{animation:cur 1.1s steps(1,end) infinite}@keyframes led{0%,100%{opacity:1}50%{opacity:.25}}@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}}</style><rect class="card" stroke-width="1.5" x="2" y="2" width="1196" height="448" rx="24"/><defs><clipPath id="win"><path d="M46 78H304L284 196H66Z"/></clipPath></defs><path class="sl" d="M30 420H330"/><path class="sf o" d="M142 218H208L220 386H130Z"/><rect class="glass o" x="165" y="246" width="20" height="30" rx="6"/><rect class="glass o" x="165" y="304" width="20" height="30" rx="6"/><path class="sf o" d="M90 420V394A8 8 0 0 1 98 386H252A8 8 0 0 1 260 394V420"/><rect class="glass o" x="108" y="398" width="24" height="12" rx="4"/><rect class="glass o" x="218" y="398" width="24" height="12" rx="4"/><path class="bot o" d="M163 420V408A12 12 0 0 1 187 408V420"/><rect class="brand o" x="44" y="206" width="262" height="12" rx="6"/><path class="sf o" d="M34 66H316L292 206H58Z"/><path class="glass" d="M46 78H304L284 196H66Z"/><path class="glass" d="M46 78H94L102 196H66ZM256 78H304L284 196H248Z"/
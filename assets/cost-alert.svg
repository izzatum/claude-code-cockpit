<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 368" role="img" aria-labelledby="t d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><title id="t">cockpit cost alert: a budget pop-up when a Claude Code session reaches your limit</title><desc id="d">A budget gauge needle reaches the $5 line while the cockpit cost alert pop-up appears and Dash, the gauge-faced pilot bot, rings a bell. The gauge for this session runs from $0 to a red tick marked your budget, $5.00, and the readout says $5.00 of $5.00 alert in red. Dash rings a hand bell, brows raised, gauge needle swung into the red zone. A toast says: cockpit: session cost $5.00 reached your $5.00 alert. Notes: once per session and budget, default $5, set 0 to turn off. The cost is an estimate from Claude Code's own cost total, not a bill.</desc><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono,.mono text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.card{fill:#F5F8FC;stroke:#CBD5E3}.sf{fill:#FFFFFF}.ink{fill:#142033}.mut{fill:#5A6B85}.lf{fill:#CBD5E3}.brand{fill:#2F6FEB}.ok{fill:#0F9D7A}.warn{fill:#C27A00}.bad{fill:#D93A3A}.bot{fill:#E9EEF6}.face{fill:#FFFFFF}.o{stroke:#142033}.sl{stroke:#CBD5E3}.sm{stroke:#5A6B85}.sb{stroke:#2F6FEB}.sok{stroke:#0F9D7A}.swarn{stroke:#C27A00}.sbad{stroke:#D93A3A}.sbot{stroke:#E9EEF6}.scard{stroke:#F5F8FC}.ssf{stroke:#FFFFFF}.tok{fill:#0F9D7A;fill-opacity:.14}.twarn{fill:#C27A00;fill-opacity:.16}.tbad{fill:#D93A3A;fill-opacity:.13}.glass{fill:#2F6FEB;fill-opacity:.08}.shd{fill:#142033;opacity:.12}.term{fill:#0F1726}.tedge{stroke:#142033}.tbar{fill:#1A2438}.tdv{stroke:#2A3850}.tt{fill:#D7E0EE}.td{fill:#7E8CA3}.tg{fill:#34D399}.ty{fill:#FBBF24}.tr{fill:#F87171}.tsy{stroke:#FBBF24}.thl{fill:#6EA8FE;fill-opacity:.24}@media (prefers-color-scheme:dark){.card{fill:#0F1622;stroke:#2A3850}.sf{fill:#172133}.ink{fill:#E6EDF7}.mut{fill:#8FA1BC}.lf{fill:#2A3850}.brand{fill:#6EA8FE}.ok{fill:#34D399}.warn{fi
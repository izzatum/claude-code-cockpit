<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1200 460" role="img" aria-labelledby="t d" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><title id="t">Cloud-sync guard blocking rm -rf before it reaches Dropbox, iCloud Drive, Google Drive or OneDrive, while npm install gets a warning</title><desc id="d">An air-traffic-control gag. Four cloud-shaped hangars with small doors are labelled iCloud Drive, Dropbox, Google Drive and OneDrive. A paper plane tagged rm -rf ~/Dropbox/project flies along the upper runway towards the Dropbox hangar. A red BLOCKED stamp sits across its path, and Dash, the gauge-faced pilot bot, stands on the runway as a marshal with a pulsing shield and a red STOP paddle, gauge needle swung into the red zone. A terminal line reads: cockpit: recursive delete inside a cloud-synced folder is blocked. On a lower lane a smaller plane tagged npm install carries on to the OneDrive hangar with an amber ticket: allowed, with a warning. Caption: Recursive deletes in synced folders: blocked. Installs and builds: a heads-up first.</desc><style>text{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif}.mono,.mono text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.card{fill:#F5F8FC;stroke:#CBD5E3}.sf{fill:#FFFFFF}.ink{fill:#142033}.mut{fill:#5A6B85}.lf{fill:#CBD5E3}.brand{fill:#2F6FEB}.ok{fill:#0F9D7A}.warn{fill:#C27A00}.bad{fill:#D93A3A}.bot{fill:#E9EEF6}.face{fill:#FFFFFF}.o{stroke:#142033}.sl{stroke:#CBD5E3}.sm{stroke:#5A6B85}.sb{stroke:#2F6FEB}.sok{stroke:#0F9D7A}.swarn{stroke:#C27A00}.sbad{stroke:#D93A3A}.sbot{stroke:#E9EEF6}.scard{stroke:#F5F8FC}.ssf{stroke:#FFFFFF}.tok{fill:#0F9D7A;fill-opacity:.14}.twarn{fill:#C27A00;fill-opacity:.16}.tbad{fill:#D93A3A;fill-opacity:.13}.glass{fill:#2F6FEB;fill-opacity:.08}.shd{fill:#142033;opacity:.12}.term{fill:#0F1726}.tedge{stroke:#142033}.tbar{fill:#1A2438}.tdv{stroke:#2A3850}.tt{fill:#D7E0EE}.td{fill:#7E8CA3}.tg{fill:#34D399}.ty{fill:#FBBF24}.tr{fill:#F87171}.tsy{stroke:#FBBF24}.thl{fill:#6EA8FE;fill-opacity:.24}@media (prefers-color-scheme:dark){.card{fill:#0F1622;stroke:#2A3850}.sf{fill:#172133}.ink{fill:#E6EDF7}.mut{fill:#8FA1BC}.lf{fill:#2A3850}.brand{fill:#6EA8FE}.ok{fill:#34D399}.warn{fill:#FBBF24}.bad{fill:#F87171}.bot{fill:#2B3A55}.face{fill:#1C2940}.o{stroke:#E6EDF7}.sl{stroke:#2A3850}.sm{stroke:#8FA1BC}.sb{stroke:#6EA8FE}.sok{stroke:#34D399}.swarn{stroke:#FBBF24}.sbad{stroke:#F87171}.sbot{stroke:#2B3A55}.scard{stroke:#0F1622}.ssf{stroke:#172133}.tok{fill:#34D399;fill-opacity:.16}.twarn{fill:#FBBF24;fill-opacity:.16}.tbad{fill:#F87171;fill-opacity:.16}.glass{fill:#6EA8FE;fill-opacity:.08}.shd{fill:#000000;opacity:.4}.tedge{stroke:#8FA1BC}}.led,.wob,.pulse,.spin,.cur{transform-box:fill-box;transform-origin:center}@media (prefers-reduced-motion:no-preference){.led{animation:led 2.4s ease-in-out infinite}.wob{animation:wob 3s ease-in-out infinite}.pulse{animation:pulse 2s ease-in-out infinite}.spin{animation:spin 4s linear infinite}.cur{animation:cur 1.1s steps(1,end) infinite}@keyframes led{0%,100%{opacity:1}50%{opacity:.25}}@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(4deg)}75%{transform:rotate(-4deg)}}@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.04)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}}</style><rect class="card" stroke-width="1.5" x="2" y="2" width="1196" height="456" rx="24"/><defs><g id="cl"><rect x="0" y="28" width="212" height="40" rx="20"/><circle cx="66" cy="32" r="19"/><circle cx="120" cy="28" r="22"/><circle cx="170" cy="38" r="15"/></g><g id="cloud"><use href="#cl" class="o" fill="none" stroke-width="5"/><use href="#cl" class="sf"/><path class="mut o" d="M17 68V55A11 11 0 0 1 39 55V68Z"/><path class="sl" stroke-width="1.5" d="M21 59H35M21 64H35"/></g><g id="pl"><path class="sf o" vector-effect="non-scaling-stroke" d="M0 0L110 34L30 40Z"/><path class="bot o" vector-effect="non-scaling-stroke" d="M30 40L110 34L40 60Z"/></g></defs><rect class="lf" x="40" y="181" width="904" height="30" rx="15"/><path class="scard" stroke-width="3" stroke-dasharray="18 14" fill="none" d="M66 196H930"/><rect class="lf" x="40" y="341" width="904" height="30" rx="15"/><path class="scard" stroke-width="3" stroke-dasharray="18 14" fill="none" d="M66 356H220"/><path class="sok" stroke-width="3.5" stroke-dasharray="14 11" fill="none" d="M602 356H922"/><path class="ok" d="M924 345L944 356L924 367Z"/><text class="mut" x="1060" y="50" font-size="24" font-weight="600" text-anchor="middle">cloud-synced folders</text><g class="ink" font-size="24" font-weight="600" text-anchor="middle"><use href="#cloud" x="954" y="68"/><text x="1078" y="124">iCloud Drive</text><use href="#cloud" x="954" y="148"/><text x="1078" y="204">Dropbox</text><use href="#cloud" x="954" y="228"/><text x="1078" y="284">Google Drive</text><use href="#cloud" x="954" y="308"/><text x="1078" y="364">OneDrive</text></g><path class="term tedge" d="M54 18H546A14 14 0 0 1 560 32V80A14 14 0 0 1 546 94H540L598 124L506 94H54A14 14 0 0 1 40 80V32A14 14 0 0 1 54 18Z"/><g class="mono" font-size="22"><text class="tt" x="62" y="48"><tspan class="td">cockpit:</tspan> recursive delete inside a</text><text class="tt" x="62" y="77">cloud-synced folder is <tspan class="tr">blocked</tspan></text></g><path class="sm" fill="none" d="M46 182H82M54 196H88M46 210H80M150 152V178"/><rect class="sf sbad" x="40" y="112" width="352" height="40" rx="20"/><text class="ink mono" x="58" y="139" font-size="22">rm -rf ~/Dropbox/project</text><use href="#pl" x="100" y="164"/><g transform="translate(380 196) rotate(-10)"><rect class="sf sbad" stroke-width="4" x="-112" y="-34" width="224" height="68" rx="10"/><rect class="sbad" fill="none" stroke-width="1.5" x="-104" y="-26" width="208" height="52" rx="6"/><text class="bad" x="2" y="12" font-size="34" font-weight="800" letter-spacing="3" text-anchor="middle">BLOCKED</text></g><path class="sm" fill="none" d="M50 344H84M58 356H92M50 368H84M146 320V348"/><rect class="sf o" x="60" y="280" width="174" height="40" rx="20"/><text class="ink mono" x="78" y="307" font-size="22">npm install</text><use href="#pl" transform="translate(108 336) scale(.72)"/><rect class="twarn swarn" x="232" y="334" width="352" height="44" rx="22"/><path class="swarn" stroke-width="1.5" stroke-dasharray="4 5" d="M280 340V372"/><path class="warn" d="M257 342L271 367H243Z"/><path class="o" stroke-width="3.5" d="M257 351V358M257 363V363"/><text class="ink" x="294" y="364" font-size="24" font-weight="600">allowed · with a warning</text><g transform="translate(676 222)"><ellipse class="shd" cx="0" cy="84" rx="56" ry="8"/><path class="o" stroke-width="15.0" fill="none" d="M-60 14Q-92 14 -102 -14"/><path class="sbot" stroke-width="10" fill="none" d="M-60 14Q-92 14 -102 -14"/><path class="o" stroke-width="15.0" fill="none" d="M60 14Q92 10 100 -26"/><path class="sbot" stroke-width="10" fill="none" d="M60 14Q92 10 100 -26"/><rect class="bot o" x="-70" y="-60" width="140" height="120" rx="56"/><path class="brand o" d="M-58 -36C-60 -84 60 -84 58 -36C30 -50 -30 -50 -58 -36Z"/><path class="o" fill="none" stroke-width="4" d="M-52 -48Q0 -64 52 -48"/><path class="o" d="M0 -72V-88"/><g class="led"><circle class="warn" cx="0" cy="-92" r="12" opacity=".25"/><circle class="warn o" cx="0" cy="-92" r="6"/></g><path class="o" fill="none" stroke-width="4" d="M-72 -20C-76 -100 76 -100 72 -20"/><rect class="mut o" x="-81" y="-24" width="17" height="32" rx="8"/><rect class="mut o" x="64" y="-24" width="17" height="32" rx="8"/><circle class="face o" cx="0" cy="-2" r="44"/><path class="o" d="M-17 27L-20 32M-30 11L-36 13M-32 -11L-38 -12M-20 -28L-24 -33M0 -35V-41M20 -28L24 -33M32 -11L38 -12"/><path class="sbad" d="M30 11L36 13M17 27L20 32"/><ellipse class="ink" cx="-12" cy="-14" rx="5" ry="6"/><ellipse class="ink" cx="12" cy="-14" rx="5" ry="6"/><path class="o" fill="none" d="M-72 6Q-64 26 -42 24"/><circle class="ink o" cx="-40" cy